<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Русь Мобайл — Тестирование игроков</title>
    <!-- Подключаем файл со стилями -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">РУСЬ <span>МОБАЙЛ</span></div>
        <div class="subtitle">Официальный портал тестирования игроков</div>
    </header>

    <div class="container">
        <!-- 1. Стартовый экран -->
        <div id="start-screen">
            <div class="form-group">
                <label for="nickname">Ваш игровой Nick_Name:</label>
                <input type="text" id="nickname" placeholder="Например: Ivan_Ivanov" required>
            </div>
            <div class="form-group">
                <label for="server">Выберите сервер:</label>
                <select id="server">
                    <option value="Сервер #1 (Москва)">Сервер #1 (Москва)</option>
                    <option value="Сервер #2 (Санкт-Петербург)">Сервер #2 (Санкт-Петербург)</option>
                </select>
            </div>
            <button class="btn" onclick="startQuiz()">Начать тестирование</button>
        </div>

        <!-- 2. Экран вопросов -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <span id="question-counter">Вопрос 1 из 5</span>
                <span id="timer">Время: 00:00</span>
            </div>
            <div class="question-text" id="question-text">Текст вопроса</div>
            <div class="options" id="options-container"></div>
        </div>

        <!-- 3. Экран результатов -->
        <div id="result-screen" class="hidden result-box">
            <h2>Тестирование завершено!</h2>
            <div class="score" id="final-score">0 / 5</div>
            <p id="result-status" class="status-text"></p>
            
            <div class="report-card" id="report-text"></div>
            
            <button class="btn" onclick="copyReport()">Скопировать отчет для администрации</button>
            <button class="btn btn-secondary" onclick="location.reload()">Пройти заново</button>
        </div>
    </div>

    <footer>
        © 2026 Русь Мобайл. Не связано с Rockstar Games.
    </footer>

    <!-- Подключаем файл с логикой теста -->
    <script src="script.js"></script>
</body>
</html>
